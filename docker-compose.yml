services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    env_file:
      - ./services/auth-service/.env

  wallet-service:
    build: ./services/wallet-service
    ports:
      - "3002:3002"
    env_file:
      - ./services/wallet-service/.env

  price-feed-service:
    build: ./services/price-feed-service
    ports:
      - "3003:3003"
    depends_on: [kafka]
    env_file:
      - ./services/price-feed-service/.env

  protocol-service:
    build: ./services/protocol-service
    ports:
      - "3004:3004"
    depends_on: [kafka]
    env_file:
      - ./services/protocol-service/.env

  execution-service:
    build: ./services/execution-service
    ports:
      - "3005:3005"
    depends_on: [kafka]
    env_file:
      - ./services/execution-service/.env

  notification-service:
    build: ./services/notification-service
    ports:
      - "3006:3006"
    depends_on: [kafka]
    env_file:
      - ./services/notification-service/.env

  ai-service:
    build: ./services/ai-service
    ports:
      - "5001:5001"
    env_file:
      - ./services/ai-service/.env

  analytics-service:
    build: ./services/analytics-service
    ports:
      - "5002:5002"
    depends_on: [kafka]
    env_file:
      - ./services/analytics-service/.env

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
